<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body class="site-shell">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-frame">
      {% include header.html %}
      <main class="content-wrapper" role="main" id="main-content">
        <div class="content-wrapper__inner">
          {{ content }}
        </div>
        {% include footer.html %}
      </main>
    </div>
    <script>
      (function () {
        var postRoot = document.querySelector(".post--single");
        if (!postRoot) { return; }

        // Heading anchors and table of contents
        var headings = Array.prototype.slice.call(postRoot.querySelectorAll("h2"));
        var used = {};
        headings.forEach(function (h) {
          if (!h.id) {
            var slug = h.textContent.trim().toLowerCase().replace(/[^\w]+/g, "-").replace(/^-+|-+$/g, "");
            while (used[slug]) { slug += "-"; }
            h.id = slug;
          }
          used[h.id] = true;
          var a = document.createElement("a");
          a.className = "anchorjs-link";
          a.href = "#" + h.id;
          a.setAttribute("aria-label", "Link to this section");
          a.textContent = "#";
          h.appendChild(a);
        });

        document.querySelectorAll("[data-post-toc]").forEach(function (toc) {
          var list = toc.querySelector(".post-toc__list");
          if (headings.length < 2) { toc.hidden = true; return; }
          headings.forEach(function (h) {
            var li = document.createElement("li");
            var link = document.createElement("a");
            link.href = "#" + h.id;
            link.textContent = h.textContent.replace(/#$/, "").trim();
            li.appendChild(link);
            list.appendChild(li);
          });
        });

        // Wrap tables so they can scroll on narrow screens
        postRoot.querySelectorAll("table").forEach(function (t) {
          if (t.parentNode.classList.contains("table-wrap") || t.closest(".highlight")) { return; }
          var w = document.createElement("div");
          w.className = "table-wrap";
          t.parentNode.insertBefore(w, t);
          w.appendChild(t);
        });

        // Code blocks: editor chrome with language label and copy button
        postRoot.querySelectorAll("pre").forEach(function (pre) {
          if (pre.closest("table") || pre.closest(".code-block-wrapper")) { return; }
          var host = pre.closest("div.highlighter-rouge, figure.highlight") || pre;
          var lang = "";
          var m = (host.className || "").match(/language-([\w+#-]+)/);
          if (m) { lang = m[1]; }
          if (!lang) {
            var code = pre.querySelector("code[class*='language-']");
            var mm = code && code.className.match(/language-([\w+#-]+)/);
            if (mm) { lang = mm[1]; }
          }
          var wrapper = document.createElement("div");
          wrapper.className = "code-block-wrapper";
          var bar = document.createElement("div");
          bar.className = "code-block-bar";
          bar.innerHTML = "<span class=\"code-block-dots\"><i></i><i></i><i></i></span>" +
            (lang ? "<span class=\"code-block-lang\">" + lang.replace(/</g, "&lt;") + "</span>" : "");
          var btn = document.createElement("button");
          btn.className = "code-copy-btn";
          btn.textContent = "Copy";
          btn.setAttribute("aria-label", "Copy code to clipboard");
          bar.appendChild(btn);
          host.parentNode.insertBefore(wrapper, host);
          wrapper.appendChild(bar);
          wrapper.appendChild(host);
          btn.addEventListener("click", function () {
            var code = pre.querySelector("code");
            navigator.clipboard.writeText(code ? code.textContent : pre.textContent).then(function () {
              btn.textContent = "Copied";
              btn.setAttribute("data-copied", "");
              setTimeout(function () {
                btn.textContent = "Copy";
                btn.removeAttribute("data-copied");
              }, 2000);
            });
          });
        });

        // Lazy loading and lightbox for images
        var lightbox = null;
        function openLightbox(src) {
          if (!lightbox) {
            lightbox = document.createElement("div");
            lightbox.className = "img-lightbox";
            var closeBtn = document.createElement("button");
            closeBtn.className = "img-lightbox__close";
            closeBtn.innerHTML = "&times;";
            closeBtn.setAttribute("aria-label", "Close");
            closeBtn.addEventListener("click", function (e) { e.stopPropagation(); closeLightbox(); });
            lightbox.appendChild(closeBtn);
            lightbox.appendChild(document.createElement("img"));
            lightbox.addEventListener("click", closeLightbox);
            document.body.appendChild(lightbox);
          }
          lightbox.querySelector("img").src = src;
          lightbox.classList.add("is-open");
          document.body.style.overflow = "hidden";
        }
        function closeLightbox() {
          if (lightbox) {
            lightbox.classList.remove("is-open");
            document.body.style.overflow = "";
          }
        }
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLightbox(); });

        postRoot.querySelectorAll("img").forEach(function (img, i) {
          if (i > 0) { img.setAttribute("loading", "lazy"); }
          if (img.closest(".post-badges") || /img\.shields\.io/.test(img.src) || img.closest(".ghfile")) { return; }
          var h = img.getAttribute("height") || img.naturalHeight || img.height;
          if (h && h < 48) { return; }
          var parent = img.parentNode;
          if (getComputedStyle(parent).position === "static") { parent.style.position = "relative"; }
          var btn = document.createElement("button");
          btn.className = "img-expand-btn";
          btn.innerHTML = "&#x26F6;";
          btn.setAttribute("aria-label", "View image fullscreen");
          btn.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); openLightbox(img.src); });
          parent.appendChild(btn);
        });
      })();
    </script>
  </body>
</html>
