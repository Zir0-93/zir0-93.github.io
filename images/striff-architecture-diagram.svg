<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="'JetBrains Mono', ui-monospace, monospace" role="img" aria-label="striff.io production architecture on DigitalOcean Kubernetes: Spring Boot API, Redis list queue, in-process ONNX inference, MongoDB, and the observability and platform stack">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2e6bff"/>
    </marker>
    <marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b6bfcb"/>
    </marker>
    <style>
      .zone     { fill:#f7f9fc; stroke:#e2e8f0; stroke-width:1.5; }
      .zonelbl  { font-size:11px; font-weight:700; fill:#94a3b8; letter-spacing:.1em; }
      .card     { fill:#ffffff; stroke:#d7dde5; stroke-width:1.5; }
      .h        { font-size:13.5px; font-weight:700; fill:#24292E; }
      .s        { font-size:11px; fill:#5b6470; }
      .t        { font-size:10px; fill:#7b8492; }
      .badge    { font-size:9.5px; font-weight:700; letter-spacing:.07em; }
      .flow     { stroke:#64748b; stroke-width:1.8; fill:none; marker-end:url(#ar); }
      .flowa    { stroke:#2e6bff; stroke-width:2; fill:none; marker-end:url(#ar-a); }
      .side     { stroke:#b6bfcb; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#ar-d); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>

  <text class="h" x="40" y="38" font-size="16">striff.io — production architecture</text>
  <text class="s" x="40" y="58">One Spring Boot service. A Redis list for durable work. Inference inside the JVM. No broker, no model server.</text>

  <!-- ══ cluster zone ══ -->
  <rect class="zone" x="40" y="80" width="800" height="404" rx="16"/>
  <text class="zonelbl" x="62" y="106">DIGITALOCEAN KUBERNETES CLUSTER</text>

  <!-- github -->
  <rect class="card" x="62" y="126" width="150" height="72" rx="10"/>
  <text class="h" x="80" y="152">GitHub</text>
  <text class="s" x="80" y="171">webhook · PR files</text>
  <text class="t" x="80" y="187">HMAC verified</text>

  <path class="flowa" d="M212 162 H286"/>
  <text class="t" x="222" y="155">202</text>

  <!-- api -->
  <rect class="card" x="286" y="118" width="168" height="88" rx="10" stroke="#2e6bff"/>
  <text class="h" x="304" y="144">Spring Boot API</text>
  <text class="s" x="304" y="163">REST · check runs</text>
  <text class="t" x="304" y="180">HPA 2–6 replicas</text>
  <text class="badge" x="304" y="196" fill="#2e6bff">-Xms1g -Xmx4g</text>

  <path class="flowa" d="M454 162 H528"/>

  <!-- redis queue -->
  <rect class="card" x="528" y="118" width="164" height="88" rx="10" stroke="#dc2626"/>
  <text class="h" x="546" y="144">Redis</text>
  <text class="s" x="546" y="163">list queue · BRPOP</text>
  <text class="t" x="546" y="180">AOF · volatile-lru</text>
  <text class="t" x="546" y="195">+ striff / prefetch cache</text>

  <path class="flow" d="M610 206 V244"/>
  <text class="t" x="618" y="228">workers pull</text>

  <!-- review task zone -->
  <rect class="zone" x="86" y="244" width="712" height="212" rx="14" stroke="#cbd5e1"/>
  <text class="zonelbl" x="108" y="268">REVIEW TASK · BOUNDED EXECUTOR (core 2 · max 4 · queue 50)</text>

  <rect class="card" x="110" y="286" width="150" height="76" rx="10"/>
  <text class="h" x="126" y="312">Scoped parse</text>
  <text class="s" x="126" y="330">striff-lib + clarpse</text>
  <text class="t" x="126" y="347">time-boxed, partial OK</text>

  <path class="flow" d="M260 324 H300"/>

  <rect class="card" x="300" y="286" width="150" height="76" rx="10"/>
  <text class="h" x="316" y="312">Detectors</text>
  <text class="s" x="316" y="330">12 run · 5 speak</text>
  <text class="t" x="316" y="347">deterministic facts</text>

  <path class="flow" d="M450 324 H490"/>

  <rect class="card" x="490" y="286" width="150" height="76" rx="10" stroke="#f59e0b"/>
  <text class="h" x="506" y="312">GNN scorer</text>
  <text class="s" x="506" y="330">ONNX, in-process</text>
  <text class="t" x="506" y="347">403-dim · evidence only</text>

  <path class="flow" d="M640 324 H680"/>

  <rect class="card" x="680" y="286" width="100" height="76" rx="10"/>
  <text class="h" x="696" y="312">LLM</text>
  <text class="s" x="696" y="330">rewords</text>
  <text class="t" x="696" y="347">never adds</text>

  <rect x="110" y="378" width="670" height="58" rx="10" fill="#f1f5ff" stroke="#2e6bff" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="s" x="128" y="400">Degrades rather than fails: parse timeout or scorer error → deterministic findings only.</text>
  <text class="t" x="128" y="418">A clean PR produces no findings, and that is a result — not an error.</text>

  <!-- mongo -->
  <rect class="card" x="862" y="118" width="150" height="88" rx="10"/>
  <text class="h" x="880" y="144">MongoDB</text>
  <text class="s" x="880" y="163">operations, reviews</text>
  <text class="t" x="880" y="180">diagram artifacts</text>
  <text class="t" x="880" y="195">status polled by client</text>
  <path class="side" d="M692 150 H858"/>

  <!-- ══ observability ══ -->
  <rect class="zone" x="862" y="238" width="298" height="218" rx="14"/>
  <text class="zonelbl" x="884" y="262">OBSERVABILITY</text>

  <rect class="card" x="884" y="278" width="120" height="52" rx="8"/>
  <text class="h" x="900" y="300" font-size="12">Prometheus</text>
  <text class="t" x="900" y="317">metrics + rules</text>

  <rect class="card" x="1016" y="278" width="120" height="52" rx="8"/>
  <text class="h" x="1032" y="300" font-size="12">Grafana</text>
  <text class="t" x="1032" y="317">dashboards</text>

  <rect class="card" x="884" y="342" width="252" height="98" rx="8" stroke="#f59e0b"/>
  <text class="badge" x="900" y="363" fill="#b45309">ALERTS THAT MATTER</text>
  <text class="t" x="900" y="382">AIReviewQueueBacklog — queued &gt; 25 / 10m</text>
  <text class="t" x="900" y="399">AIReviewFailuresHigh — &gt; 10 fails / 15m</text>
  <text class="t" x="900" y="421">Backlog catches the outage that never</text>
  <text class="t" x="900" y="435">returns a single HTTP error.</text>

  <!-- ══ platform ══ -->
  <rect class="zone" x="40" y="506" width="1120" height="112" rx="14"/>
  <text class="zonelbl" x="62" y="530">PLATFORM · GITOPS</text>

  <rect class="card" x="62" y="544" width="140" height="54" rx="8"/>
  <text class="h" x="78" y="566" font-size="12">Terraform</text>
  <text class="t" x="78" y="583">cluster + DNS</text>

  <rect class="card" x="216" y="544" width="140" height="54" rx="8"/>
  <text class="h" x="232" y="566" font-size="12">GitHub Actions</text>
  <text class="t" x="232" y="583">build · one artifact</text>

  <rect class="card" x="370" y="544" width="140" height="54" rx="8"/>
  <text class="h" x="386" y="566" font-size="12">ArgoCD</text>
  <text class="t" x="386" y="583">declarative deploy</text>

  <rect class="card" x="524" y="544" width="150" height="54" rx="8"/>
  <text class="h" x="540" y="566" font-size="12">Blue/green</text>
  <text class="t" x="540" y="583">model ships in image</text>

  <rect class="card" x="688" y="544" width="150" height="54" rx="8"/>
  <text class="h" x="704" y="566" font-size="12">NGINX Ingress</text>
  <text class="t" x="704" y="583">cert-manager TLS</text>

  <rect class="card" x="852" y="544" width="284" height="54" rx="8"/>
  <text class="h" x="868" y="566" font-size="12">Vault</text>
  <text class="t" x="868" y="583">secrets · no credentials in manifests</text>

  <!-- legend -->
  <g transform="translate(40,646)">
    <line x1="0" y1="10" x2="34" y2="10" class="flowa"/>
    <text class="t" x="42" y="14">request path</text>
    <line x1="150" y1="10" x2="184" y2="10" class="flow"/>
    <text class="t" x="192" y="14">in-process step</text>
    <line x1="316" y1="10" x2="350" y2="10" class="side"/>
    <text class="t" x="358" y="14">persistence / side-channel</text>
  </g>
  <text class="t" x="40" y="690">Absent by design: message broker, inference service, GPU. Each would add a failure mode this workload has not yet earned.</text>
</svg>
